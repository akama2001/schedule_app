{% extends "base.html" %}

{% block title %}Регистрация студента{% endblock %}

{% block content %}
<div class="container">
    <div class="hero-section">
        <h1>Регистрация студента</h1>
        <p class="subtitle">Заполните форму для создания учётной записи</p>
    </div>

    <div class="selection-card">
        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label for="username">Имя пользователя</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>

            <div class="form-group">
                <label for="group_id">Группа</label>
                <select class="form-control" id="group_id" name="group_id" required>
                    <option value="">-- Выберите группу --</option>
                    {% for group in groups %}
                    <option value="{{ group.id }}">{{ group.name }} ({{ group.course }} курс)</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
        </form>

        <p class="text-center" style="margin-top: 1.5rem; text-align: center;">
            Уже есть аккаунт?
            <a href="{{ url_for('login') }}" style="color: var(--primary); text-decoration: none;">Войти</a>
        </p>
    </div>
</div>
{% endblock %}
