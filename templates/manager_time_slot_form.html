{% extends "base.html" %}
{% block title %}{% if slot %}Редактирование{% else %}Создание{% endif %} временного слота{% endblock %}
{% block content %}
<div class="container">
    <div class="schedule-header">
        <h1>{% if slot %}Редактирование{% else %}Создание{% endif %} временного слота</h1>
    </div>
    <div class="selection-card">
        <form method="POST">
            <div class="form-group">
                <label for="order">Порядковый номер</label>
                <input type="number" class="form-control" id="order" name="order" value="{{ slot.order if slot else '' }}" min="1" required>
            </div>
            <div class="form-group">
                <label for="name">Название (например, "1-я пара")</label>
                <input type="text" class="form-control" id="name" name="name" value="{{ slot.name if slot else '' }}" required>
            </div>
            <div class="form-group">
                <label for="start_time">Время начала</label>
                <input type="time" class="form-control" id="start_time" name="start_time" value="{{ slot.start_time.strftime('%H:%M') if slot else '' }}" required>
            </div>
            <div class="form-group">
                <label for="end_time">Время окончания</label>
                <input type="time" class="form-control" id="end_time" name="end_time" value="{{ slot.end_time.strftime('%H:%M') if slot else '' }}" required>
            </div>
            <div class="actions">
                <button type="submit" class="btn btn-success">Сохранить</button>
                <a href="{{ url_for('manager_time_slots') }}" class="btn btn-danger">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
