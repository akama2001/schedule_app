{% extends "base.html" %}

{% block title %}{% if room %}Редактирование помещения{% else %}Создание помещения{% endif %}{% endblock %}

{% block content %}
<div class="container">
    <div class="schedule-header">
        <h1>{% if room %}Редактирование помещения{% else %}Создание помещения{% endif %}</h1>
    </div>

    <div class="selection-card">
        <form method="POST">
            <div class="form-group">
                <label for="name">Номер/название помещения</label>
                <input type="text" class="form-control" id="name" name="name" value="{{ room.name if room else '' }}" required>
            </div>
            <div class="form-group">
                <label for="type">Тип помещения</label>
                <select class="form-control" id="type" name="type">
                    <option value="">-- Выберите тип --</option>
                    <option value="Лекционная" {% if room and room.type == 'Лекционная' %}selected{% endif %}>Лекционная</option>
                    <option value="Лабораторная" {% if room and room.type == 'Лабораторная' %}selected{% endif %}>Лабораторная</option>
                    <option value="Компьютерная" {% if room and room.type == 'Компьютерная' %}selected{% endif %}>Компьютерная</option>
                    <option value="Спортивный зал" {% if room and room.type == 'Спортивный зал' %}selected{% endif %}>Спортивный зал</option>
                    <option value="Актовый зал" {% if room and room.type == 'Актовый зал' %}selected{% endif %}>Актовый зал</option>
                    <option value="Другое" {% if room and room.type == 'Другое' %}selected{% endif %}>Другое</option>
                </select>
            </div>
            <div class="form-group">
                <label for="capacity">Вместимость (человек)</label>
                <input type="number" class="form-control" id="capacity" name="capacity" value="{{ room.capacity if room else '' }}">
            </div>
            <div class="form-group">
                <label for="location_id">Локация</label>
                <select class="form-control" id="location_id" name="location_id" required>
                    <option value="">-- Выберите локацию --</option>
                    {% for loc in locations %}
                    <option value="{{ loc.id }}" {% if room and room.location_id == loc.id %}selected{% endif %}>{{ loc.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="actions">
                <button type="submit" class="btn btn-primary">Сохранить</button>
                <a href="{{ url_for('manager_rooms') }}" class="btn btn-secondary">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
